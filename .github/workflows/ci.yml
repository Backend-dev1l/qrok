name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: buf lint

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose -f deploy/docker-compose.yml --project-directory . up -d --wait
      - run: go run github.com/pressly/goose/v3/cmd/goose@latest -dir migrations postgres "${DB_DSN}" up
        env:
          DB_DSN: postgres://qrok:qrok@127.0.0.1:5432/qrok?sslmode=disable
      - run: go test -race -tags integration -count=1 ./...
      - run: go test -tags e2e -count=1 -timeout 10m ./...
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --project-directory . logs
