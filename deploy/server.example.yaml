# Пример конфига qrok server. Скопируйте в qrok.yaml или укажите путь
# флагом -config / переменной QROK_CONFIG. Env-переменные QROK_* имеют
# приоритет над файлом, флаги — над env.

log:
  level: info      # debug | info | warn | error
  format: json     # json | text | pretty

http:
  addr: ":8080"
  request_timeout: 30s
  max_body_bytes: 1048576   # 1 МБ
  allow_insecure_api: true   # dev: REST без Bearer; в проде — false
  cors_origins:
    - http://localhost:5173

grpc:
  addr: ":9090"

gateway:
  allow_insecure_listen: true    # dev: ListenStream без qrok login; в проде — false

postgres:
  dsn: postgres://qrok:qrok@127.0.0.1:5432/qrok?sslmode=disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  connect_timeout: 5s

redis:
  addr: localhost:6379
  password: ""
  db: 0

s3:
  endpoint: 127.0.0.1:9000
  bucket: qrok-payloads
  access_key: qrok
  secret_key: qrok-secret
  use_ssl: false

events:
  payload_threshold_bytes: 262144   # 256 КБ — порог гибридного хранения payload
  max_payload_bytes: 1048576        # 1 МБ — жёсткий лимит события
